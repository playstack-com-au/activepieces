name: Playstack image

on:
  push:
    branches:
      - playstack
  workflow_dispatch:
    inputs:
      platforms:
        description: Target platforms
        default: linux/amd64
        required: true

concurrency:
  group: playstack-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.repository == 'playstack-com-au/activepieces'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: actions/checkout@v4

      - name: Read version
        id: meta
        run: |
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: true
          tags: |
            ghcr.io/playstack-com-au/activepieces:latest
            ghcr.io/playstack-com-au/activepieces:${{ steps.meta.outputs.version }}
            ghcr.io/playstack-com-au/activepieces:${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
